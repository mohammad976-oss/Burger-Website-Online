<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>

<style>
    body{
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: aquamarine;

        /* center content */
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    #summary{
        width:90%;
        max-width:420px;
        background:white;
        border:2px solid black;
        border-radius:20px;
        padding:20px;
        text-align:center;
        position:relative;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    #summary h1{
        color:brown;
        margin-bottom:10px;
    }

    #details h2{
        margin:6px 0;
        font-size:18px;
    }

    .food-img{
        width:120px;
        height:120px;
        margin:15px auto;
        background-image:url(./image\ copy\ 5.png);
        background-size:cover;
        background-position:center;
        border-radius:12px;
        border:2px solid black;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        background-color:blue;
        color:white;
        font-size:16px;
        border-radius:8px;
        cursor:pointer;
        margin-top:10px;
    }

    button:hover{
        background-color:darkblue;
    }

    /* 💻 Laptop screens */
    @media(min-width:768px){
        #summary{
            max-width:500px;
        }

        #details h2{
            font-size:20px;
        }

        .food-img{
            width:150px;
            height:150px;
        }
    }
</style>
</head>

<body>

<div id="summary">
    <h1>ORDER DETAILS</h1>

    <div class="food-img"></div>

    <div id="details">
         
            <h2>Order Name:Corn & Cheese Veg Burger</h2><br>
            <h2>price:100</h2>
            <h2>---------------</h2>
            <h2>Total price:100</h2>
        <a href="./payment.html">
            <button>Proceed To Pay</button>
        </a>
    </div>
</div>

</body>
</html>
